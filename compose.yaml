# Local play only. Production uses infra/docker-compose.prod.yml.
x-app: &app
  image: settlehex-local
  build:
    context: .
    dockerfile: infra/Dockerfile.local
  init: true
  environment:
    NODE_ENV: development
    DATABASE_URL: postgres://settlehex:settlehex@postgres:5432/settlehex
    PUBLIC_APP_URL: http://localhost:3000
    BETTER_AUTH_URL: http://localhost:3000
    NEXT_PUBLIC_GAME_SERVER_ORIGIN: http://localhost:8000
    GAME_SERVER_INTERNAL_URL: http://game:8080
    SETTLEHEX_SETTLEGRAPH_V2_ENABLED: "0"
    NEXT_PUBLIC_SETTLEHEX_SETTLEGRAPH_V2: "0"
    NEXT_TELEMETRY_DISABLED: "1"

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: settlehex
      POSTGRES_USER: settlehex
      POSTGRES_PASSWORD: settlehex
    volumes:
      - local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlehex -d settlehex"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  game:
    <<: *app
    command: ["pnpm", "serve"]
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000').catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    <<: *app
    command: ["pnpm", "dev", "--hostname", "0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      game:
        condition: service_healthy

volumes:
  local-data:
