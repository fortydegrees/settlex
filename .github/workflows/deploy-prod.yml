name: deploy-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: settlehex_test
          POSTGRES_USER: settlehex
          POSTGRES_PASSWORD: settlehex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settlehex -d settlehex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.13.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check release notes for push deploy
        if: github.event_name == 'push'
        run: |
          pnpm release:check -- --require-approved
          if ! git diff --quiet "${{ github.event.before }}" -- release/release-notes.json; then
            pnpm release:check -- --require-bump-from "${{ github.event.before }}"
          fi
      - name: Check release notes for manual deploy
        if: github.event_name != 'push'
        run: pnpm release:check -- --require-approved
      - name: Prepare test database
        run: pnpm db:migrate:test
        env:
          DATABASE_URL: postgres://settlehex:settlehex@localhost:5432/settlehex_test
      - run: pnpm verify
        env:
          MATCH_ALERT_POSTGRES_URL: postgres://settlehex:settlehex@localhost:5432/settlehex_test

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Add OCI host to known_hosts
        run: ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}

      - name: Sync deployment files to OCI
        env:
          OCI_APP_DIR: ${{ secrets.OCI_APP_DIR }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh "$OCI_USER@$OCI_HOST" "mkdir -p '$OCI_APP_DIR'"
          rsync -az --delete \
            --filter=':- .gitignore' \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.env.prod' \
            ./ "$OCI_USER@$OCI_HOST:$OCI_APP_DIR/"

      - name: Deploy to OCI
        env:
          OCI_APP_DIR: ${{ secrets.OCI_APP_DIR }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          SETTLEX_BUILD_SHA: ${{ github.sha }}
        run: |
          SETTLEX_BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          SETTLEX_RELEASE_VERSION="$(node scripts/release/read-release-notes.mjs)"
          ssh "$OCI_USER@$OCI_HOST" "
            cd '$OCI_APP_DIR' &&
            SETTLEX_BUILD_SHA='$SETTLEX_BUILD_SHA' SETTLEX_BUILD_DATE='$SETTLEX_BUILD_DATE' SETTLEX_RELEASE_VERSION='$SETTLEX_RELEASE_VERSION' infra/scripts/deploy-prod.sh
          "
