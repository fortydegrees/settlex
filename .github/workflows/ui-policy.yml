name: UI design policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.13.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui-policy
      - run: pnpm ui:check
        env:
          UI_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
